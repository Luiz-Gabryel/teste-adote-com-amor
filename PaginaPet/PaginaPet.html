<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pet – Audote Com Amor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Montserrat:wght@500;600;700&display=swap"

    />

    <link rel="stylesheet" href="./PaginaPet.css" />
    <link rel="stylesheet" href="/config/Nav.css" />

  <body>
    <header data-menu-site></header>

        <p id="petRaca" class="raca"></p>

      </div>

      <div>
        <div id="petTags" class="tags"></div>

        <section>

          <p id="petSobre"></p>
        </section>

        <section>
          <h2 class="laranja">Como Cuidar de Mim</h2>

          <p id="petCuidados"></p>
        </section>

        <div id="petMiniaturas" class="miniaturas"></div>
      </div>
      <div class="pet__voltar">
        <a id="voltarCatalogo" class="btn btn--voltar" href="/adote.html"
          >← Voltar ao catálogo</a
        >
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/Auth/config.js"></script>
    <script src="../js/data/pets.js"></script>
