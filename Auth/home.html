<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Home</title>

    <link rel="stylesheet" href="/config/Nav.css" />
  </head>

  <body>
    <header data-menu-site></header>

    <main>
      <h1>Você está logado!</h1>

      <a href="/PaginaPet/PaginaPet.html">Ver Página do Pet</a>
      <a href="/adote.html">Ver Pets</a>
      <a href="/saiba-mais.html">Saiba Mais</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <script>
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
      );

      async function iniciar() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();

        if (!session) {
          window.location.href = "Auth.html";
        }
      }

      iniciar();
    </script>

    <script src="/vlibras.js"></script>
    <script src="/config/Nav.js"></script>
  </body>
